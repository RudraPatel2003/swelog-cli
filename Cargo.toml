[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[workspace.package]
authors = ["Rudra Patel <patelrudra2003@gmail.com>"]
edition = "2024"
description = "A Rust CLI to track your daily accomplishments in Obsidian"
keywords = ["rust", "cli", "obsidian", "daily", "log"]
categories = ["command-line-utilities"]
repository = "https://github.com/RudraPatel2003/swelog-cli"
homepage = "https://github.com/RudraPatel2003/swelog-cli"
readme = "README.md"
license = "MIT"

[workspace.dependencies]
assert_cmd = "2.2.2"
async-trait = "0.1.89"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
command-extra = "1.1.0"
dirs = "7.0.0"
futures = "0.3.34"
httpmock = "0.8.3"
keyring = "4.2.0"
miette = "7.6.0"
oauth2 = { version = "5.0.0", default-features = false }
predicates = "3.1.4"
ollama-rs = "0.3.6"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13.5", features = ["form", "json", "query"] }
rmcp = { version = "3.3.0", default-features = false, features = [
    "auth",
    "client",
    "reqwest",
    "transport-streamable-http-client-reqwest",
] }
rpassword = "7.5.4"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
supports-hyperlinks = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
webbrowser = "1.2.4"
